logLevel: info
policy: sync
# The chart defaults to `txt`, which keeps ownership in TXT records this
# provider cannot store, so it finds no owner on any record and drops every
# update and delete from the plan. PROVIDER_OPENWRT_OWNERSHIPID below decides
# what sync may touch instead.
registry: noop
# Without a filter, anyone who can create an Ingress or a Service can answer
# any name for the whole LAN, and sync can delete any name on the router.
domainFilters:
  - foobar.io
# The default is A,AAAA,CNAME. This provider writes A and CNAME only, so an
# AAAA endpoint — which any dual-stack Service produces — would be dropped and
# warned about on every reconcile.
extraArgs:
  - --managed-record-types=A
  - --managed-record-types=CNAME
  # ExternalDNS exits on a request unanswered after the read plus the write
  # timeout, 15 s by default, and a change set makes a router call per
  # record.
  - --webhook-provider-write-timeout=60s
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/vizzletf/external-dns-openwrt-next
      tag: v0.9.0
    # No probe overrides: the chart already probes /healthz on port 8080, which
    # is where this webhook serves them. The provider API is on 8888, loopback
    # only, and the kubelet could not reach it there anyway.
    # The chart sets a security context for the ExternalDNS container only.
    # The webhook writes nothing to disk and needs no privileges.
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
    # Every variable the webhook reads. All but the ownership ID, the router
    # address, the credentials and the status mirror are set to their
    # defaults.
    env:
      - name: SHUTDOWN_TIMEOUT_SECONDS
        value: "5"
      - name: LOG_LEVEL
        value: info
      - name: LOG_ENCODING
        value: json
      - name: ROUTER_ADDRESS
        value: 127.0.0.1
      - name: ROUTER_PORT
        value: "8888"
      # Serves /healthz and /metrics.
      - name: ROUTER_HEALTHCHECK_PORT
        value: "8080"
      # Ownership: only records carrying this marker are managed. The webhook
      # does not start without it. An empty value disables ownership: only
      # with a registry that keeps ownership itself, never with policy=sync
      # otherwise, or ExternalDNS deletes records it did not create.
      - name: PROVIDER_OPENWRT_OWNERSHIPID
        value: external-dns
      - name: PROVIDER_OPENWRT_LUCIRPC_HOSTNAME
        value: "192.168.1.1"
      - name: PROVIDER_OPENWRT_LUCIRPC_PORT
        value: "443"
      - name: PROVIDER_OPENWRT_LUCIRPC_SSL
        value: "true"
      - name: PROVIDER_OPENWRT_LUCIRPC_TIMEOUT
        value: "15"
      - name: PROVIDER_OPENWRT_LUCIRPC_INSECURE_SKIP_VERIFY
        value: "false"
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_USERNAME
        value: root
      # services.yaml creates this Secret for the local k3d cluster.
      - name: PROVIDER_OPENWRT_LUCIRPC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: openwrt-luci
            key: password
      # Mirrors each record's status into OpenWrtRecord objects, for
      # `kubectl get owr`. Needs record-status.yaml applied first. Off by
      # default.
      - name: PROVIDER_STATUS_ENABLED
        value: "true"
      # Empty: the namespace the webhook runs in.
      - name: PROVIDER_STATUS_NAMESPACE
        value: ""
