{{- if and .Values.rbac.create .Values.recordStatus.enabled }}
# The webhook writes the OpenWrtRecord objects to the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "external-dns-openwrt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-dns-openwrt.labels" . | nindent 4 }}
rules:
  - apiGroups: ["external-dns-openwrt.vizzletf.github.io"]
    resources: ["openwrtrecords"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "external-dns-openwrt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-dns-openwrt.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "external-dns-openwrt.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "external-dns-openwrt.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
