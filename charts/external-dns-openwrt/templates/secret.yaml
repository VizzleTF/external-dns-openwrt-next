{{- if not .Values.router.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "external-dns-openwrt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-dns-openwrt.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.router.password | quote }}
{{- end }}
