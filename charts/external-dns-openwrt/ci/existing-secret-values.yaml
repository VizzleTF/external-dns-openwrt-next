# The owner's setup: a Secret made out of band, a CA bundle, a fixed SA name.
ownershipID: homelab
router:
  hostname: router.lan
  existingSecret: openwrt-router
  existingSecretPasswordKey: pass
  caBundle:
    configMapName: openwrt-ca
    key: openwrt.pem
serviceAccount:
  name: external-dns-openwrt
externalDNS:
  domainFilters: [vaka.work]
serviceMonitor:
  enabled: true
