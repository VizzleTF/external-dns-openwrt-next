---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: external-dns-openwrt-next
build:
  artifacts:
    - image: webhook
      ko:
        dir: ./cmd/webhook
        # ko's default, which release.yaml builds the published image on.
        fromImage: cgr.dev/chainguard/static
deploy:
  helm:
    releases:
    - name: external-dns
      repo: https://kubernetes-sigs.github.io/external-dns
      remoteChart: external-dns
      version: 1.22.0
      setValueTemplates:
        provider:
          webhook:
            image:
              repository: "{{.IMAGE_REPO_webhook}}"
              tag: "{{.IMAGE_TAG_webhook}}"
      valuesFiles:
        - example/values.yaml
manifests:
  rawYaml:
    - example/services.yaml
    - example/record-status.yaml