---
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: external-dns-openwrt-next
build:
  artifacts:
    - image: webhook
      ko:
        dir: ./cmd/webhook
        # ko's default, which release.yaml builds the published image on.
        fromImage: cgr.dev/chainguard/static
deploy:
  helm:
    releases:
    - name: external-dns-openwrt
      chartPath: charts/external-dns-openwrt
      setValueTemplates:
        webhook.image.repository: "{{.IMAGE_REPO_webhook}}"
        webhook.image.tag: "{{.IMAGE_TAG_webhook}}"
      setValues:
        ownershipID: external-dns
        # Point these at a router you can test on.
        router.hostname: 192.168.1.1
        router.username: root
        # services.yaml creates this Secret.
        router.existingSecret: openwrt-luci
        externalDNS.domainFilters[0]: foobar.io
manifests:
  rawYaml:
    - example/services.yaml
