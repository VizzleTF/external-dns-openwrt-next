name: go lint, vet, test, build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: golangci
      uses: golangci/golangci-lint-action@v9
      with:
        # Pinned, not `latest`: a new linter release turning on a new check
        # would otherwise fail CI on code nobody touched.
        version: v2.13

    - name: vet
      run: go vet ./...

    - name: test
      run: go test -v ./...

    - name: test (race)
      run: go test -race ./...

    - name: build
      run: go build ./...