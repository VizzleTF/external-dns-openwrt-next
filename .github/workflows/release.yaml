name: publish image and chart

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not the go directive, the oldest Go the module builds with: the
          # image ships the standard library of the Go it is built with.
          # check-latest skips an older patch cached on the runner.
          go-version: '1.27.x'
          check-latest: true
          # A restored build cache is what another run saved, and its objects
          # would end up in the image.
          cache: false

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      # ghcr rejects upper-case path segments, the owner is VizzleTF.
      - name: Resolve image repository
        id: repo
        run: echo "value=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | ko login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # A manual run builds whatever ref it is pointed at, which must not
      # replace the image `latest` names.
      - name: Build and push
        env:
          KO_DOCKER_REPO: ${{ steps.repo.outputs.value }}
          TAGS: ${{ github.event_name == 'push' && format('{0},latest', github.ref_name) || github.ref_name }}
        run: |
          ko build ./cmd/webhook \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="$TAGS" \
            --image-refs=image-refs.txt
          cat image-refs.txt

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: github.ref_type == 'tag'
        with:
          version: v4.3.0

      # The chart's version is the tag without its `v`, and its appVersion,
      # the webhook image tag it defaults to, is the tag itself. A manual run
      # from a branch publishes no chart. ghcr creates a new package private:
      # after the first push, make vizzletf/charts/external-dns-openwrt public
      # in its Package settings, or `helm install` asks for a login.
      - name: Package and push chart
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.repo.outputs.value }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/external-dns-openwrt --version "${TAG#v}" --app-version "$TAG"
          helm push "external-dns-openwrt-${TAG#v}.tgz" "oci://${REPO%/*}/charts"
